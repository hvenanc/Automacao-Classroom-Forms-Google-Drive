<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
    .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .aluno-link { color: #0d6efd; cursor: pointer; font-weight: 600; text-decoration: underline; }
    .scroll-box { max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; background: white; border-radius: 8px; }
    .badge-custom { font-size: 0.85rem; padding: 0.5em 0.8em; }
  </style>
</head>
<body>

<div class="container py-4">
  <h3 class="mb-4 text-primary fw-bold"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Dashboard Classroom</h3>
  
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card card-custom p-4">
        <h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-gear-fill me-2"></i>Sincronização</h6>
        
        <label class="small fw-bold mb-1">Modalidade:</label>
        <select id="modalidade" class="form-select form-select-sm mb-3 shadow-sm">
          <option value="EJA">EJA (Mínimo 3 Desafios)</option>
          <option value="EM">Ensino Médio (Mínimo 2 Desafios)</option>
        </select>
        
        <label class="small fw-bold mb-1">Turmas para Processar:</label>
        <div id="checkArea" class="scroll-box mb-3 shadow-sm">Carregando turmas...</div>
        
        <button id="btnSync" class="btn btn-primary btn-sm w-100 fw-bold shadow">
          <i class="bi bi-arrow-repeat me-2"></i>SINCRONIZAR SELECIONADAS
        </button>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h6 class="fw-bold m-0 text-secondary"><i class="bi bi-person-check-fill me-2"></i>Frequência</h6>
          <select id="selTurma" class="form-select form-select-sm w-50 shadow-sm"></select>
        </div>
        
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr><th>Estudante</th><th class="text-center">Desafios</th><th class="text-center">Projetos</th></tr>
            </thead>
            <tbody id="corpo">
              <tr><td colspan="3" class="text-center text-muted py-4">Selecione uma turma para visualizar os dados</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="mP" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow">
  <div class="modal-header bg-light"><h5 class="modal-title fw-bold" id="mNome"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body p-0"><ul id="mList" class="list-group list-group-flush"></ul></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let listaAlunos = [];
  
  window.onload = () => {
    google.script.run.withSuccessHandler(turmas => {
      const area = document.getElementById('checkArea');
      const sel = document.getElementById('selTurma');
      area.innerHTML = ''; sel.innerHTML = '<option selected disabled>Escolha para visualizar...</option>';
      turmas.forEach(t => {
        area.innerHTML += `<div class="form-check"><input type="checkbox" class="t-chk form-check-input" value="${t.nome}"> <span class="small">${t.nome}</span></div>`;
        sel.innerHTML += `<option value="${t.nome} (${t.id})">${t.nome} (${t.id})</option>`;
      });
    }).getListaTurmas();
  };

  document.getElementById('selTurma').onchange = (e) => {
    const corpo = document.getElementById('corpo');
    corpo.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-primary fw-bold">Carregando dados da aba...</td></tr>';
    google.script.run.withSuccessHandler(data => {
      listaAlunos = data;
      if(data.length === 0) {
        corpo.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Aba não encontrada ou sem dados. Clique em sincronizar.</td></tr>';
        return;
      }
      corpo.innerHTML = data.map((a, i) => `
        <tr>
          <td><div class="aluno-link" onclick="ver(${i})">${a.nome}</div><small class="text-muted d-block">${a.email}</small></td>
          <td class="text-center"><span class="badge bg-primary badge-custom rounded-pill">${a.freqDesafios}%</span></td>
          <td class="text-center"><span class="badge bg-info text-dark badge-custom rounded-pill">${a.freqMiniprojetos}%</span></td>
        </tr>`).join('');
    }).getAlunosData(e.target.value);
  };

  function ver(i) {
  const a = listaAlunos[i];
  document.getElementById('mNome').innerText = a.nome;
  const l = document.getElementById('mList');

  // Verifica se há pendências
  if (a.pendencias && a.pendencias.length > 0) {
    l.innerHTML = a.pendencias.map(p => `
      <li class="list-group-item py-3">
        <div class="d-flex flex-column align-items-start">
          <span class="small fw-bold text-wrap mb-2">${p.atividade}</span>
          <span class="badge bg-danger-subtle text-danger border border-danger-subtle text-wrap text-start" 
                style="white-space: normal; line-height: 1.4;">
            ${p.status}
          </span>
        </div>
      </li>`).join(''); // Removido o '/n' que causava erro de texto no HTML
  } else {
    l.innerHTML = `
      <li class="p-4 text-center text-success fw-bold">
        <i class="bi bi-patch-check-fill me-2"></i>Tudo em dia!
      </li>`;
  }

  // Inicializa e exibe o modal
  const modalElement = document.getElementById('mP');
  const modalInstancia = bootstrap.Modal.getOrCreateInstance(modalElement);
  modalInstancia.show();
}

  document.getElementById('btnSync').onclick = () => {
    const selecionadas = Array.from(document.querySelectorAll('.t-chk:checked')).map(c => c.value);
    const mod = document.getElementById('modalidade').value;
    if(selecionadas.length === 0) return alert("Selecione ao menos uma turma!");
    
    const btn = document.getElementById('btnSync');
    btn.disabled = true; btn.innerHTML = 'Processando...';
    
    google.script.run.withSuccessHandler(msg => {
      alert(msg);
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-arrow-repeat me-2"></i>SINCRONIZAR SELECIONADAS';
    }).prepararAtualizacao(selecionadas, mod);
  };
</script>
</body>
</html>
